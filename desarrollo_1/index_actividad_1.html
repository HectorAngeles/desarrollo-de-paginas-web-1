<html>
    <head>
        <title>Pagina de registro</title>
    </head>
    <body>
        <form>
            <h1 class="etiqueta">Captura de datos personales</h1>
            <h2 class="etiqueta">Ingresa los datos que se te piden</h2>
            <label class="etiqueta"> Nombre </label>
            <input name="nombre" type="text">
            <br>
            <label class="etiqueta"> Edad </label>
            <input name="edad" type="number">
            <br>
            <label class="etiqueta"> Ciudad </label>
            <input name="ciudad" type="text">
            <br>
            <label class="etiqueta"> Fecha de nacimiento </label>
            <input name="fecha_nacimiento" type="date">
            <br>
            <label class="etiqueta"> Pasatiempo favorito </label>
            <input name="pasatiempo_favorito" type="text">
            <br>
            <a href="resultado_actividad_1.html" class="boton">Enviar datos</a>
        </form>
        <style>
            .etiqueta {
                font-family: Courier New, Courier, monospace;
                font-size: large;
                color: blueviolet;
            }
            .boton {
                background-color: blueviolet;
                color: white;
                padding: 15px 32px;
                text-align: center;
                display: inline-block;
                font-size: large;
                cursor: pointer;
            }
        </style>
    </body>
</html>
